# Monthly refresh of the ingredient database (Phase 2 spec §12.D).
#
# Re-downloads every source, rebuilds, runs the independent verification, and
# — only if the data changed — opens a pull request whose description is the
# change review: which sources moved and every row whose regulatory status
# changed. Merging that PR is what deploys the new release. If verification
# fails, the run fails and GitHub emails the repository owner.
#
# Needs one repository setting for the PR step:
#   Settings → Actions → General → Workflow permissions →
#   "Allow GitHub Actions to create and approve pull requests"
# Without it the branch is still pushed and the run says where to open the PR.
name: Monthly data refresh

on:
  schedule:
    - cron: '0 7 1 * *'   # 07:00 UTC on the 1st of each month
  workflow_dispatch:       # "Run workflow" button, for an off-cycle refresh

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      npm_config_yes: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            rakk-app/package-lock.json
            pipeline/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # stdlib only: reads the EFSA .xlsx

      - name: Install
        run: |
          (cd rakk-app && npm ci)
          (cd pipeline && npm ci)

      - name: Download every source
        working-directory: pipeline
        run: node fetch.mjs

      - name: Build
        working-directory: rakk-app
        run: npx tsx ../pipeline/build.ts

      - name: Verify (independent second pass)
        working-directory: rakk-app
        run: npx tsx ../pipeline/verify.ts

      - name: Emit release
        id: emit
        working-directory: rakk-app
        run: |
          npx tsx ../pipeline/emit.ts | tee emit.log
          if grep -q '^no change' emit.log; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check the new release
        if: steps.emit.outputs.changed == 'true'
        working-directory: rakk-app
        run: |
          node scripts/test-catalog-lookup.mjs
          node ../pipeline/check-release.mjs

      - name: Change review and reviewer sheet
        if: steps.emit.outputs.changed == 'true'
        working-directory: pipeline
        run: |
          node diff.mjs
          node review-sample.mjs

      - name: Open a pull request
        if: steps.emit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="data-refresh/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pipeline/out pipeline/sources/manifest.json supabase/migrations rakk-app/src/data/catalog/bundled.json
          git commit -m "Monthly data refresh $(date -u +%Y-%m-%d)" -m "Generated by .github/workflows/data-refresh.yml. Review pipeline/out/change-review.md before merging; merging deploys the release."
          git push -u origin "$BRANCH"
          head -c 60000 pipeline/out/change-review.md > pr-body.md
          gh pr create --base main --head "$BRANCH" --title "Monthly data refresh $(date -u +%Y-%m-%d)" --body-file pr-body.md \
            || echo "::warning::Could not open the PR (see the setting at the top of this workflow). The branch $BRANCH is pushed: open the PR from GitHub."

      - name: Nothing changed
        if: steps.emit.outputs.changed != 'true'
        run: echo "Sources re-downloaded and verified; the data is identical to the released build. No PR."
